<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Viação Hoffmann — Sistema de Viagens</title>
<meta name="description" content="Protótipo demonstrativo do sistema de viagens da Viação Hoffmann.">
<link rel="icon" href="logo.png">
<style>
:root{color-scheme:light;--navy:#0b1d38;--navy2:#132d50;--gold:#e5b84b;--gold2:#f4d985;--paper:#ffffff;--surface:#ffffff;--surface2:#f3f6f9;--text:#15233a;--muted:#68778b;--border:#dce3ec;--green:#2c9b70;--shadow:0 12px 30px #07152a10}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer}.app{min-height:100vh;background:var(--paper)}.splash{position:fixed;inset:0;z-index:20;background:var(--navy);display:flex;align-items:center;justify-content:center;flex-direction:column;color:white;transition:opacity .7s,visibility .7s}.splash.hide{opacity:0;visibility:hidden}.brandmark{width:min(78vw,340px);max-height:180px;object-fit:contain;display:block;background:#fff;border-radius:14px;padding:10px 14px;box-shadow:0 12px 40px #0003;animation:zoom 1.1s ease-in-out both}.splash h1{font-family:Georgia,serif;letter-spacing:3px;margin:22px 0 5px;font-size:clamp(22px,4vw,34px);animation:fade .8s .25s both}.splash p{color:#c7d0df;letter-spacing:3px;text-transform:uppercase;font-size:10px;animation:fade .8s .4s both}.loadingline{height:3px;width:190px;background:#ffffff24;margin-top:24px;overflow:hidden}.loadingline:after{content:"";display:block;width:45%;height:100%;background:linear-gradient(90deg,var(--gold),#fff1b0);animation:load 1.5s ease-in-out infinite}@keyframes zoom{0%{transform:scale(.5);opacity:0}70%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}@keyframes load{from{transform:translateX(-110%)}to{transform:translateX(240%)}}
header{background:var(--navy);color:white;border-bottom:3px solid var(--gold)}.topbar{max-width:1200px;margin:auto;padding:15px 22px;display:flex;align-items:center;justify-content:space-between;gap:18px}.brand{display:flex;align-items:center;gap:12px}.header-logo{display:block;width:clamp(150px,22vw,225px);height:auto;max-height:58px;object-fit:contain;background:#fff;border-radius:8px;padding:4px 7px;box-sizing:border-box}.brand small{display:block;color:#c3cddd;font-size:10px;letter-spacing:2px;margin-top:5px}.brand strong{font-family:Georgia,serif;letter-spacing:1.6px;font-size:17px}.brand small{display:block;color:#c3cddd;font-size:10px;letter-spacing:2px;margin-top:3px}.header-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.header-actions button{border:1px solid #ffffff30;background:#ffffff0b;color:white;border-radius:9px;padding:9px 12px;font-size:12px}.header-actions button.active,.header-actions button:hover{background:var(--gold);color:var(--navy);border-color:var(--gold)}main{max-width:1200px;margin:auto;padding:28px 22px 56px}.hero{position:relative;overflow:hidden;border-radius:20px;background:linear-gradient(115deg,#0b1d38 0%,#173b64 70%,#214d74 100%);color:white;padding:30px;min-height:245px;display:flex;align-items:center;box-shadow:var(--shadow)}.hero:after{content:"";position:absolute;width:360px;height:360px;border:1px solid #e5b84b45;border-radius:50%;right:-90px;top:-95px;box-shadow:0 0 0 28px #e5b84b0b,0 0 0 62px #e5b84b09}.hero-copy{position:relative;z-index:1;max-width:600px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:2.5px;color:var(--gold2);font-weight:800}.hero h2{font-family:Georgia,serif;font-size:clamp(28px,4vw,43px);line-height:1.1;margin:12px 0}.hero p{color:#d5dfeb;max-width:470px;line-height:1.6;margin:0}.bus-illustration{position:absolute;right:35px;bottom:26px;width:min(39%,360px);z-index:1;opacity:.95}.section-title{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:28px 0 14px}.section-title h3{margin:0;font-size:20px}.section-title p{margin:5px 0 0;color:var(--muted);font-size:13px}.search-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;margin-top:-24px;position:relative;z-index:2;box-shadow:var(--shadow)}.search-grid{display:grid;grid-template-columns:1.1fr 1.1fr 1fr .7fr auto;gap:12px;align-items:end}.field label{display:block;font-size:11px;color:var(--muted);font-weight:700;margin-bottom:7px}.field input,.field select{width:100%;background:var(--paper);border:1px solid var(--border);border-radius:9px;padding:12px;color:var(--text);min-width:0;outline:none}.field input:focus,.field select:focus{border-color:var(--gold)}.primary{border:0;border-radius:10px;background:var(--gold);color:#14233b;font-weight:800;padding:13px 18px;white-space:nowrap}.primary:hover{background:var(--gold2)}.secondary{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:9px;padding:10px 13px}.quick-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:20px}.stat{background:var(--surface);border:1px solid var(--border);padding:17px;border-radius:14px;display:flex;gap:12px;align-items:center}.stat-icon{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:#e5b84b20;color:var(--gold);font-size:21px}.stat strong{display:block;font-size:21px}.stat small{color:var(--muted);font-size:12px}.results{display:grid;gap:12px}.trip{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:20px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px}.trip-route{display:flex;align-items:center;gap:12px}.city{min-width:75px}.city strong{display:block;font-size:18px}.city small{color:var(--muted);font-size:11px}.route-line{flex:1;min-width:50px;text-align:center;color:var(--muted);font-size:10px}.route-line span{display:block;border-top:1px dashed var(--gold);margin:6px 0}.boarding-box{display:inline-flex;align-items:center;gap:5px;background:#e5b84b22;border:1px solid #e5b84b80;color:var(--text);border-radius:8px;padding:6px 9px;font-size:11px;font-weight:800;margin-top:7px}.trip-price{text-align:right}.trip-price strong{display:block;font-size:23px;color:var(--gold)}.trip-price small{color:var(--muted)}.empty{padding:25px;text-align:center;border:1px dashed var(--border);border-radius:14px;color:var(--muted)}.panel{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px}.panel h3{margin-top:0}.admin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.admin-card{border:1px solid var(--border);border-radius:12px;padding:16px;background:var(--paper)}.admin-card strong{display:block;font-size:24px;margin:9px 0 4px}.admin-card span{font-size:12px;color:var(--muted)}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:12px;border-bottom:1px solid var(--border)}th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.7px}.tag{font-size:10px;border-radius:20px;padding:5px 8px;background:#2c9b701a;color:var(--green);font-weight:800}.notice{padding:12px 14px;border-radius:10px;background:#e5b84b18;border:1px solid #e5b84b45;color:var(--text);font-size:12px;line-height:1.5;margin-top:18px}.modal-backdrop{position:fixed;inset:0;background:#06101dc9;z-index:30;display:grid;place-items:center;padding:18px}.modal{width:min(620px,100%);max-height:90vh;overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:22px;box-shadow:0 24px 80px #0005}.modal-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.modal-head h3{margin:0}.close{border:0;background:var(--surface2);color:var(--text);border-radius:8px;width:36px;height:36px;font-size:20px}.seat-grid{display:grid;grid-template-columns:repeat(4,minmax(38px,1fr));gap:7px;max-width:360px;max-height:42vh;overflow:auto;margin:18px auto;padding:4px}.seat{min-height:38px}.seat{border:1px solid var(--border);background:var(--paper);border-radius:8px;padding:12px 5px;color:var(--text);font-weight:800}.seat.selected{background:var(--gold);color:#102039;border-color:var(--gold)}.seat.taken{background:var(--surface2);color:var(--muted);opacity:.5;cursor:not-allowed}.seat:nth-child(4n+3){margin-left:15px}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.summary-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px}.ticket{background:#fff;color:#13233b;border-radius:14px;overflow:hidden;border:1px solid #d8dee8;margin-top:16px}.ticket-banner{background:#0b1d38;color:#fff;padding:18px 20px;border-bottom:4px solid #e5b84b;display:flex;align-items:center;justify-content:space-between;gap:12px}.ticket-banner strong{font-family:Georgia,serif;letter-spacing:1.5px}.ticket-banner small{display:block;color:#c8d3e2;font-size:10px;letter-spacing:1px;margin-top:4px}.ticket-body{padding:20px}.ticket-route{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:18px 0;border-bottom:1px dashed #ccd4df}.ticket-city strong{display:block;font-size:21px}.ticket-city small{display:block;color:#66758a;font-size:11px;margin-top:5px}.ticket-city:last-child{text-align:right}.ticket-arrow{color:#c29423;font-size:22px}.ticket-details{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:16px 0}.ticket-detail small{display:block;color:#66758a;font-size:10px;text-transform:uppercase;letter-spacing:.7px;margin-bottom:5px}.ticket-detail strong{font-size:14px;overflow-wrap:anywhere}.ticket-qr{display:flex;flex-direction:column;align-items:center;text-align:center;border-top:1px dashed #ccd4df;padding:18px 10px 8px}.ticket-qr img{width:180px;height:180px;max-width:100%;image-rendering:pixelated}.ticket-qr p{font-size:11px;color:#66758a;max-width:300px;line-height:1.5}.ticket-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.ticket-status{display:inline-block;border:1px solid #c29423;color:#765810;background:#fff6d8;border-radius:20px;padding:5px 9px;font-size:10px;font-weight:800}.admin-card h3{margin:8px 0}.admin-card .field input{box-sizing:border-box}.admin-card select{width:100%;margin-top:5px}.panel select{background:var(--paper);border:1px solid var(--border);border-radius:8px;padding:8px;color:var(--text);max-width:100%}input[type=checkbox]{width:18px;height:18px;accent-color:var(--gold)}@media print{body *{visibility:hidden!important}#modal-root,#modal-root *{visibility:visible!important}.modal-backdrop{position:static!important;background:white!important;padding:0!important;display:block!important}.modal{width:100%!important;max-height:none!important;overflow:visible!important;border:0!important;box-shadow:none!important}.modal-head,.ticket-actions,.modal>.notice{display:none!important}.ticket{break-inside:avoid}.ticket-qr img{width:150px;height:150px}}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--navy);color:white;border:1px solid var(--gold);border-radius:12px;padding:12px 18px;z-index:50;box-shadow:var(--shadow);max-width:calc(100% - 28px);font-size:13px}footer{border-top:1px solid var(--border);padding:20px;text-align:center;color:var(--muted);font-size:11px}
@media(max-width:850px){.search-grid{grid-template-columns:1fr 1fr}.search-grid .primary{grid-column:1/-1}.bus-illustration{width:34%;right:15px;opacity:.55}.trip{grid-template-columns:1fr auto}.trip-price{grid-column:2;grid-row:1}.trip .trip-action{grid-column:1/-1}.admin-grid{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.topbar{padding:12px 15px;align-items:flex-start;flex-direction:column}.header-actions{width:100%}.header-actions button{flex:1}.brand strong{font-size:15px}main{padding:18px 14px 35px}.hero{padding:24px 20px;min-height:220px}.hero p{max-width:85%}.bus-illustration{width:46%;right:-10px;bottom:8px;opacity:.27}.search-card{padding:14px;margin-top:-15px}.search-grid{grid-template-columns:1fr 1fr;gap:10px}.field label{font-size:10px}.field input,.field select{padding:11px 9px;font-size:13px}.quick-stats{gap:8px}.stat{padding:11px;gap:8px;align-items:flex-start}.stat-icon{display:none}.stat strong{font-size:18px}.stat small{font-size:10px}.section-title h3{font-size:18px}.trip{padding:14px;gap:10px}.trip-route{gap:6px}.city{min-width:57px}.city strong{font-size:16px}.route-line{min-width:28px}.trip-price strong{font-size:20px}.trip .primary{padding:10px 12px}.admin-grid{grid-template-columns:1fr}.form-row{grid-template-columns:1fr}.brandmark{width:82px;height:82px}}
</style>

class ApiError extends Error{constructor(status,msg){super(msg);this.status=status}}
async function api(method,path,body){let r;try{r=await fetch('/api'+path,{method,headers:body!==undefined?{'Content-Type':'application/json'}:undefined,body:body!==undefined?JSON.stringify(body):undefined,credentials:'same-origin'})}catch(e){throw new ApiError(0,'Sem conexão com o servidor. Verifique sua internet.')}let j=null;try{j=await r.json()}catch(e){}if(!r.ok)throw new ApiError(r.status,(j&&j.error)||('Erro '+r.status));return j}
function handleApiError(e){if(e&&e.status===401&&staffLogged){staffLogged=false;staffRole=null;staffName=null;adminData=null;driverData=null;render()}toast((e&&e.message)||'Erro inesperado.')}
const clientId=(()=>{try{let v=localStorage.getItem('vh_client_id');if(!v){v=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():'anon-'+Math.random().toString(16).slice(2)+'-'+Date.now();localStorage.setItem('vh_client_id',v)}return v}catch(e){return 'anon-'+Math.random().toString(16).slice(2)+'-'+Date.now()}})();

async function loadMyReservations(){myReservations=(await api('GET','/reservations?clientId='+encodeURIComponent(clientId))).reservations}
function applyAdminData(){adminApps=adminData.apps;vhDriverNames=adminData.driverNames;vhDriverTrips=adminData.driverTrips;vhDriverRequests=adminData.driverRequests;tripStatus=adminData.tripStatus;fleetStatus=adminData.fleetStatus}
function applyDriverData(){vhDriverTrips=driverData.trips;vhDriverRequests=driverData.requests;tripStatus=driverData.tripStatus}

const getDriverApplications=()=>adminApps;

is para demonstração':'Viagens em destaque'}</h3><p id="results-subtitle">${esc(resultsSubtitle())}</p></div><button class="secondary" onclick="showFeatured()">Ver destaques</button></div><div class="results" id="results">${tripCards(searchResults)}</div><div class="notice">ℹ️ <strong>Pesquisa interna:</strong> a busca consulta somente as viagens cadastradas neste sistema, usando origem, destino e data. Os horários, preços, vagas e BOX de embarque são demonstrativos e precisam ser confirmados pela Viação Hoffmann/terminal antes da viagem. Não abre sites externos nem representa disponibilidade real.</div>`}
function tripCards(list){if(!list.length)return '<div class="empty">Não foi possível montar horários para este trecho. Confira os nomes das cidades e tente novamente.</div>';return list.map(t=>`<article class="trip"><div class="trip-route"><div class="city"><strong>${t.depart}</strong><small>${esc(t.from)}</small></div><div class="route-line">${t.duration}<span></span>${t.simulated?'Horário ilustrativo':'Viagem cadastrada'}</div><div class="city"><strong>${t.arrive}${nextDay(t)}</strong><small>${esc(t.to)}</small></div></div><div class="trip-price"><strong>${fmt(t.price)}</strong><small>${esc(t.bus)} · ${availableOf(t)} vagas</small><div class="boarding-box">🚌 Embarque: ${esc(t.box||'BOX a confirmar')}</div></div><div class="trip-action"><button class="primary" onclick="openBooking('${esc(t.id)}')">Escolher poltrona</button></div></article>`).join('')}
function canonicalCity(name){const n=normCity(name);const m=brazilMunicipalities.find(x=>normCity(x.name)===n);if(m)return m.name;return fallbackCities.find(c=>normCity(c)===n)||null}
function resultsSubtitle(){if(searched)return `${searchForm.from} → ${searchForm.to} · ${dateBR(resultsDate)} · ${searchResults.length} horário(s). Tabela e valores ilustrativos.`;return brazilMunicipalities.length?`${brazilMunicipalities.length.toLocaleString('pt-BR')} municípios brasileiros disponíveis · pesquise viagens cadastradas no sistema`:'Pesquise viagens cadastradas no sistema'}
function cityOptions(){const list=brazilMunicipalities.length?brazilMunicipalities:fallbackCities.map(name=>({name,uf:''}));return list.map(m=>`<option value="${esc(m.name)}" label="${esc(m.name)}${m.uf?' - '+esc(m.uf):''}"></option>`).join('')}
async function searchTrips(){const typedFrom=document.getElementById('origin').value.trim(),typedTo=document.getElementById('destination').value.trim(),date=document.getElementById('travel-date').value;if(!typedFrom||!typedTo){toast('Informe a cidade de origem e a cidade de destino.');return}if(normCity(typedFrom)===normCity(typedTo)){toast('Escolha uma origem e um destino diferentes.');return}const from=canonicalCity(typedFrom),to=canonicalCity(typedTo);if(!from||!to){toast('Cidade não encontrada: '+(!from?typedFrom:typedTo)+'. Escolha uma opção da lista.');return}if(!date||date<todayISO){toast('Escolha uma data a partir de hoje.');return}const pax=Number(document.getElementById('passengers').value)||1;try{const r=await api('GET','/search?from='+encodeURIComponent(from)+'&to='+encodeURIComponent(to)+'&date='+date);searchForm={from,to,date,pax};resultsDate=date;searched=true;searchResults=r.trips;render();document.getElementById('results').scrollIntoView({behavior:'smooth',block:'nearest'})}catch(e){handleApiError(e)}}

pan>Motorista: Carlos Eduardo Silva (DEMO)</span></p></div><div class="admin-card">🚌 <strong>7107 · Marcopolo Paradiso G7</strong><span>46 lugares · Escala noturna</span><p><span>Motorista: Marcos Vinícius Pereira (DEMO)</span></p></div><div class="admin-card">🚌 <strong>8108 · Marcopolo Paradiso G8</strong><span>46 lugares · Escala noturna</span><p><span>Motorista: André Luiz Martins (DEMO)</span></p></div></div><div class="notice">Este painel serve para apresentar a ideia do sistema. Ele não tem autenticação, banco de dados ou integração com operação real.</div>`}

async function createVhDriverTrip(){const g=id=>document.getElementById(id)?.value||'';const from=g('vh-trip-from').trim(),to=g('vh-trip-to').trim(),date=g('vh-trip-date'),hour=g('vh-trip-hour'),mode=g('vh-trip-mode'),driver=g('vh-trip-driver');if(!from||!to||!date||!hour){toast('Preencha origem, destino, data e horário.');return}if(from.toLowerCase()===to.toLowerCase()){toast('Origem e destino devem ser diferentes.');return}if(mode==='Escala'&&!driver){toast('Selecione o motorista para a escala.');return}await act(()=>api('POST','/admin/driver-trips',{from,to,date,hour,mode,driver}),'Viagem adicionada à gestão de motoristas.')}

function driverTripsBlock(me){if(!me)return '';const mine=vhDriverTrips.filter(t=>t.driver===me.name);const open=vhDriverTrips.filter(t=>t.mode==='Solicitação'&&!t.driver);const myReq=vhDriverRequests;const tripOf=id=>vhDriverTrips.find(t=>t.id===id);return `<div class="section-title"><div><h3>Escalas definidas pelo proprietário</h3><p>Aceite ou recuse as viagens atribuídas a você.</p></div></div><div class="panel">${mine.length?mine.map(t=>`<div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--border)"><div><strong>${esc(t.from)} → ${esc(t.to)}</strong><br><small>${dateBR(t.date)} · ${esc(t.hour)} · ${esc(t.status)}</small></div><div>${t.status==='Aguardando aceite'?`<button class="primary" onclick="updateVhTrip(${t.id},'Aceita')">Aceitar</button> <button class="secondary" onclick="updateVhTrip(${t.id},'Recusada')">Recusar</button>`:''}</div></div>`).join(''):'<p style="color:var(--muted)">Nenhuma escala atribuída a você.</p>'}</div><div class="section-title"><div><h3>Viagens abertas para solicitação</h3><p>Manifeste interesse; o proprietário aprova ou rejeita.</p></div></div><div class="panel">${open.length?open.map(t=>{const r=myReq.find(x=>x.tripId===t.id&&x.status==='Pendente');return `<div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--border)"><div><strong>${esc(t.from)} → ${esc(t.to)}</strong><br><small>${dateBR(t.date)} · ${esc(t.hour)}</small></div><div>${r?'<span class="tag">Solicitação pendente</span>':`<button class="primary" onclick="requestVhTrip(${t.id})">Solicitar viagem</button>`}</div></div>`}).join(''):'<p style="color:var(--muted)">Nenhuma viagem aberta no momento.</p>'}${myReq.filter(r=>r.status!=='Pendente').map(r=>{const t=tripOf(r.tripId);return `<p style="font-size:13px;color:var(--muted)">${t?esc(t.from)+' → '+esc(t.to):'Viagem'} · solicitação <b>${esc(r.status)}</b></p>`}).join('')}</div>`}

eld"><label for="vh-trip-to">DESTINO</label><input id="vh-trip-to" placeholder="Cidade de destino"></div><div class="field"><label for="vh-trip-date">DATA</label><input id="vh-trip-date" type="date"></div><div class="field"><label for="vh-trip-hour">HORÁRIO</label><input id="vh-trip-hour" type="time" value="08:00"></div><div class="field"><label for="vh-trip-mode">TIPO DE ORGANIZAÇÃO</label><select id="vh-trip-mode" onchange="document.getElementById('vh-driver-assignment').style.display=this.value==='Escala'?'block':'none'"><option value="Escala">Escala definida pelo proprietário</option><option value="Solicitação">Viagem aberta para solicitação</option></select></div><div class="field" id="vh-driver-assignment"><label for="vh-trip-driver">MOTORISTA DA ESCALA</label><select id="vh-trip-driver"><option value="">Selecione o motorista</option>${driverNameOptions().map(n=>`<option value="${esc(n)}">${esc(n)}</option>`).join('')}</select></div></div><button class="primary" style="margin-top:12px" onclick="createVhDriverTrip()">＋ Criar viagem/escala</button><div class="section-title"><div><h3>Solicitações para aprovar ou rejeitar</h3></div></div>${vhDriverRequests.length?vhDriverRequests.map(r=>`<div class="admin-card" style="margin-bottom:10px"><strong>${esc(r.driver)}</strong><span>${esc(r.from)} → ${esc(r.to)} · ${dateBR(r.date)} às ${esc(r.hour)}</span><p>Status: <b>${esc(r.status)}</b></p>${r.status==='Pendente'?`<button class="primary" onclick="reviewVhRequest(${r.id},true)">Aprovar</button> <button class="secondary" onclick="reviewVhRequest(${r.id},false)">Rejeitar</button>`:''}</div>`).join(''):'<p style="color:var(--muted)">Nenhuma solicitação de viagem recebida ainda.</p>'}<div class="section-title"><div><h3>Escalas e viagens dos motoristas</h3></div></div>${vhDriverTrips.length?`<div class="table-wrap"><table><thead><tr><th>Trecho</th><th>Data/saída</th><th>Modo</th><th>Motorista</th><th>Status</th><th>Ações</th></tr></thead><tbody>${vhDriverTrips.map(t=>`<tr><td>${esc(t.from)} → ${esc(t.to)}</td><td>${dateBR(t.date)} · ${esc(t.hour)}</td><td>${esc(t.mode)}</td><td>${esc(t.driver||'Aguardando solicitação')}</td><td>${esc(t.status)}</td><td>${t.mode==='Escala'&&t.status==='Aguardando aceite'?`<button class="secondary" onclick="updateVhTrip(${t.id},'Aceita')">Marcar aceita</button> <button class="secondary" onclick="updateVhTrip(${t.id},'Recusada')">Marcar recusada</button>`:'—'}</td></tr>`).join('')}</tbody></table></div>`:'<p style="color:var(--muted)">Nenhuma escala criada ainda.</p>'}<div class="notice">Protótipo local: os dados desta nova área ficam salvos neste navegador. Para uso em vários celulares/computadores, será necessário banco de dados compartilhado. Não alteramos a tela de reservas, compra de passagens, poltronas nem tarifas.</div></section>`}

async function submitDriverApplication(){const get=id=>document.getElementById(id)?.value.trim()||'';const body={name:get('reg-name'),phone:get('reg-phone'),email:get('reg-email'),city:get('reg-city'),cnh:get('reg-cnh'),experience:get('reg-exp')};if(!body.name||!body.phone||!body.email||!body.city||!body.cnh){toast('Preencha todos os campos obrigatórios.');return}try{await api('POST','/driver-applications',body);render();toast('Cadastro enviado! Aguarde a análise do proprietário.')}catch(e){handleApiError(e)}}
const val=id=>document.getElementById(id)?.value||'';
function ownerLoginCard(){return `<div style="font-size:28px">👑</div><h3>Proprietário / Administrador</h3><span>Acesso aos controles da empresa, análise dos cadastros e gestão da equipe.</span><div class="field" style="margin-top:14px"><label for="owner-pin">SENHA DO ADMINISTRADOR</label><input id="owner-pin" type="password" autocapitalize="off" autocorrect="off" spellcheck="false" autocomplete="current-password" placeholder="Senha do proprietário" onkeydown="if(event.key==='Enter')staffLogin('owner')"></div><button class="primary" style="margin-top:10px;width:100%" onclick="staffLogin('owner')">Entrar como administrador</button>`}
function showCodeModal(name,code){document.getElementById('modal-root').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><section class="modal"><div class="modal-head"><h3>Cadastro aprovado</h3><button class="close" onclick="closeModal()">×</button></div><p>Código individual de <strong>${esc(name)}</strong>:</p><div style="font-size:34px;font-weight:900;letter-spacing:4px;text-align:center;margin:14px 0">${esc(code)}</div><div class="notice">Anote e entregue ao motorista agora. Por segurança, o código não fica salvo e não será exibido de novo (para trocar, revogue o acesso e aprove outra vez).</div><div class="ticket-actions"><button class="primary" onclick="closeModal()">Já anotei</button></div></section></div>`}
async function staffLogin(role){const el=document.getElementById(role==='owner'?'owner-pin':'driver-pin');if(!el||!el.value){toast('Digite '+(role==='owner'?'a senha de administrador.':'seu código de acesso.'));return}try{const r=await api('POST','/login',{role,secret:el.value});staffRole=r.role;staffName=r.name||null;staffLogged=true;await loadStaffData();render()}catch(e){toast(e.message)}}
async function reviewDriver(id,action){try{const r=await api('POST','/admin/driver-applications/review',{id,action});await loadStaffData();render();if(action==='approve')showCodeModal(r.name,r.code);else toast('Cadastro marcado como recusado.')}catch(e){handleApiError(e)}}
async function staffLogout(){try{await api('POST','/logout',{})}catch(e){}staffRole=null;staffLogged=false;staffName=null;adminData=null;driverData=null;adminApps=[];render()}
function fleetControlPanel(){const fleet=fleetList;return `<div class="section-title"><div><h3>🛰️ Rastreador demonstrativo da frota</h3><p>Atualize o estado dos veículos e veja onde eles estariam na operação simulada.</p></div></div><div class="admin-grid">${fleet.map(([id,model,seats])=>{const status=fleetStatus[id]||'Disponível';const moving=status==='Em viagem';const workshop=status==='Na oficina';return `<div class="admin-card"><span>FROTA · ${id}</span><h3>${model}</h3><span>${seats}</span><p><strong style="font-size:16px;color:${workshop?'#b45309':moving?'#16805d':'var(--text)'}">${status}</strong></p><div class="field"><label>Status do veículo</label><select onchange="setFleetStatus('${id}',this.value)"><option ${status==='Disponível'?'selected':''}>Disponível</option><option ${status==='Em viagem'?'selected':''}>Em viagem</option><option ${status==='Na oficina'?'selected':''}>Na oficina</option><option ${status==='Em manutenção'?'selected':''}>Em manutenção</option></select></div><p><small>📍 ${moving?(fleetLocation[id]||'Trecho rodoviário · posição simulada'):workshop?'Garagem/oficina central · posição simulada':status==='Em manutenção'?'Pátio de manutenção · posição simulada':'Garagem operacional · posição simulada'}</small></p>${moving?`<div style="height:7px;background:var(--border);border-radius:9px;overflow:hidden"><div style="width:${35+(Number(id.replace(/\D/g,''))%55)}%;height:100%;background:var(--green)"></div></div><small>Progresso estimado · rastreamento fictício</small>`:''}</div>`}).join('')}</div><div class="notice">O rastreador é apenas visual para apresentação: não usa GPS, telemetria ou localização real. Os status são alterados manualmente neste navegador.</div>`}
async function setFleetStatus(id,status){try{const r=await api('POST','/admin/fleet-status',{id,status});fleetStatus=r.fleetStatus;if(adminData)adminData.fleetStatus=fleetStatus;if(status==='Em viagem'&&!fleetLocation[id])fleetLocation[id]='Rodovia da rota escalada · posição simulada';render();toast('Frota '+id+': '+status+' (demonstração)')}catch(e){handleApiError(e);render()}}
function ownerDashboard(){const revenue=adminReservations().reduce((a,r)=>a+(Number(r.price)||0),0);return `<div class="section-title"><div><h3>👑 Painel do proprietário</h3><p>Resumo da operação e controles da Viação Hoffmann.</p></div><button class="secondary" onclick="staffLogout()">Sair da área restrita</button></div><div class="admin-grid"><div class="admin-card"><span>Viagens cadastradas</span><strong>${tripsCache.length}</strong><span>Rotas de demonstração</span></div><div class="admin-card"><span>Pré-reservas</span><strong>${adminReservations().length}</strong><span>Registros desta sessão</span></div><div class="admin-card"><span>Valor total ilustrativo</span><strong>${fmt(revenue)}</strong><span>Não representa recebimentos</span></div></div><div class="section-title"><div><h3>Cadastro e contratação de motoristas</h3><p>Revise os formulários enviados e aprove somente quem você decidir contratar.</p></div><span class="tag">SÓ ADMINISTRADOR</span></div><div class="panel table-wrap">${getDriverApplications().length?`<table><thead><tr><th>Nome / contato</th><th>Cidade</th><th>CNH</th><th>Experiência</th><th>Status</th><th>Ações</th></tr></thead><tbody>${getDriverApplications().map(a=>`<tr><td><strong>${esc(a.name)}</strong><br><small>${esc(a.phone)} · ${esc(a.email)}</small></td><td>${esc(a.city)}</td><td>${esc(a.cnh)}</td><td>${esc(a.experience)}</td><td><span class="tag" style="background:${a.status==='Aprovado'?'#2c9b701a':a.status==='Recusado'?'#b91c1c1a':'#e5b84b22'};color:${a.status==='Aprovado'?'#16805d':a.status==='Recusado'?'#b91c1c':'#8a6714'}">${esc(a.status)}</span>${a.hasCode?'<br><small>Código individual emitido</small>':''}</td><td>${a.status==='Pendente'?`<button class="primary" onclick="reviewDriver(${a.id},'approve')">Aprovar</button> <button class="secondary" onclick="reviewDriver(${a.id},'reject')">Recusar</button>`:a.status==='Aprovado'?`<button class="secondary" onclick="reviewDriver(${a.id},'reject')">Revogar acesso</button>`:'—'}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">Ainda não há candidatos cadastrados. Quando alguém preencher o formulário, o cadastro aparecerá aqui para sua análise.</div>'}</div><div class="section-title"><div><h3>Controle de viagens</h3><p>Acompanhe o andamento das viagens de exemplo.</p></div><button class="secondary" onclick="exportReservations()">Exportar reservas CSV</button></div><div class="panel table-wrap"><table><thead><tr><th>Trecho</th><th>Data</th><th>Saída</th><th>Ônibus</th><th>Status</th><th>Ação</th></tr></thead><tbody>${tripsCache.map(t=>`<tr><td>${esc(t.from)} → ${esc(t.to)}</td><td>${dateBR(t.date)}</td><td>${t.depart}</td><td>${esc(t.bus)}</td><td><span class="tag">${tripStatus[t.id]||'Programada'}</span></td><td><select aria-label="Status da viagem" onchange="setTripStatus('${t.id}',this.value)"><option ${(!tripStatus[t.id]||tripStatus[t.id]==='Programada')?'selected':''}>Programada</option><option ${tripStatus[t.id]==='Em andamento'?'selected':''}>Em andamento</option><option ${tripStatus[t.id]==='Concluída'?'selected':''}>Concluída</option><option ${tripStatus[t.id]==='Cancelada'?'selected':''}>Cancelada</option></select></td></tr>`).join('')}</tbody></table></div><div class="section-title"><div><h3>Reservas e passageiros</h3><p>Dados gerados durante o teste do sistema.</p></div></div><div class="panel table-wrap">${adminReservations().length?`<table><thead><tr><th>Código</th><th>Trecho</th><th>Data</th><th>Poltrona</th><th>Valor</th></tr></thead><tbody>${adminReservations().map(r=>`<tr><td>${r.code}</td><td>${esc(r.from)} → ${esc(r.to)}</td><td>${dateBR(r.date)}</td><td>${r.seat}</td><td>${fmt(r.price)}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">Ainda não há reservas nesta sessão. As reservas de teste aparecerão aqui.</div>'}</div>${fleetControlPanel()}<div class="notice">Os dados ficam apenas nesta página/sessão. Este painel não está ligado a banco de dados, pagamentos ou GPS real.</div>`}
function driverDashboard(){const me=driverData?driverData.me:null;const assigned=tripsCache.filter(t=>['1','2','3','4','5','6','9','10','11'].includes(String(t.id)));return `<div class="section-title"><div><h3>🚌 Painel do motorista${me?' · '+esc(me.name):''}</h3><p>Escala, passageiros e preparação para a viagem.</p></div><button class="secondary" onclick="staffLogout()">Sair da área restrita</button></div><div class="notice">Escala fictícia para demonstração. Nenhuma viagem real foi atribuída a você.</div>${driverTripsBlock(me)}<div class="section-title"><div><h3>Escala de demonstração</h3><p>Selecione uma viagem para consultar a lista de embarque.</p></div></div><div class="results">${assigned.map(t=>{return `<article class="panel"><div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap"><div><strong>${esc(t.from)} → ${esc(t.to)}</strong><p style="margin:7px 0;color:var(--muted);font-size:13px">${dateBR(t.date)} · Saída ${t.depart} · Chegada prevista ${t.arrive}</p><span class="tag">${tripStatus[t.id]||'Programada'}</span></div><div><strong>Ônibus: ${esc(t.bus)}</strong><p style="margin:7px 0;color:var(--muted);font-size:12px">${availableOf(t)} vagas livres hoje</p></div></div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><button class="primary" onclick="showManifest('${t.id}')">Lista de passageiros</button><button class="secondary" onclick="setTripStatus('${t.id}','Em andamento')">Iniciar viagem</button><button class="secondary" onclick="setTripStatus('${t.id}','Concluída')">Finalizar viagem</button></div></article>`}).join('')}</div><div class="section-title"><div><h3>Checklist antes de sair</h3><p>Marque os itens conferidos para cada viagem.</p></div></div><div class="panel">${['Conferir documentação e escala','Verificar pneus, luzes e condições do veículo','Conferir combustível e equipamentos de segurança','Confirmar passageiros e poltronas','Registrar qualquer problema para a equipe'].map((x,i)=>`<label style="display:flex;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--border)"><input type="checkbox" ${driverChecks[i]?'checked':''} onchange="driverChecks[${i}]=this.checked">${x}</label>`).join('')}<p><button class="secondary" onclick="driverChecks={};render()">Limpar checklist</button></p></div><div class="notice">Checklist e status são demonstrativos e não substituem procedimentos de segurança, comunicação com a empresa nem sistemas oficiais.</div>`}
async function showManifest(id){const t=findTrip(id);if(!t)return;let ps=[];try{ps=(await api('GET','/staff/manifest?tripId='+encodeURIComponent(id)+'&date='+todayISO)).passengers}catch(e){handleApiError(e);return}document.getElementById('modal-root').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><section class="modal"><div class="modal-head"><h3>Lista de embarque</h3><button class="close" onclick="closeModal()">×</button></div><p><strong>${esc(t.from)} → ${esc(t.to)}</strong><br>${dateBR(todayISO)} · Saída ${t.depart}</p>${ps.length?`<div class="table-wrap"><table><thead><tr><th>Poltrona</th><th>Código</th></tr></thead><tbody>${ps.map(r=>`<tr><td>${r.seat}</td><td>${esc(r.code)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Nenhum passageiro reservado para esta viagem hoje.</div>'}<div class="ticket-actions"><button class="primary" onclick="window.print()">Imprimir lista</button><button class="secondary" onclick="closeModal()">Fechar</button></div></section></div>`}
async function setTripStatus(id,status){try{const r=await api('POST','/staff/trip-status',{tripId:id,status});tripStatus=r.tripStatus;render();toast('Status atualizado para: '+status)}catch(e){handleApiError(e)}}
function exportReservations(){if(!adminReservations().length){toast('Não há reservas para exportar.');return}const rows=[['Código','Origem','Destino','Data','Poltrona','Valor'],...adminReservations().map(r=>[r.code,r.from,r.to,r.date,r.seat,r.price])];const csv=rows.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'}));a.download='reservas_viacao_hoffmann_demo.csv';a.click();URL.revokeObjectURL(a.href);}
function render(){const main=document.getElementById('main');main.innerHTML=view==='home'?home():view==='reservas'?reservationsPage():view==='equipe'?staffPage():(staffLogged&&staffRole==='owner')?adminPage():adminGate();document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));}
async function setView(v){view=v;render();window.scrollTo({top:0,behavior:'smooth'});try{if(view==='reservas')await loadMyReservations();else if((view==='admin'||view==='equipe')&&staffLogged)await loadStaffData();else if(view==='home'&&!searchResults.length&&!searched)await showFeatured()}catch(e){handleApiError(e)}render()}
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));
async function openBooking(id){const t=findTrip(id);if(!t)return;selectedTrip=t;selectedSeats=[];let taken=[];try{taken=(await api('GET','/seats?trip='+encodeURIComponent(t.id)+'&date='+resultsDate)).taken}catch(e){handleApiError(e);return}const pax=searchForm.pax||1;document.getElementById('modal-root').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><section class="modal"><div class="modal-head"><h3>Escolha sua poltrona</h3><button class="close" onclick="closeModal()">×</button></div><p style="color:var(--muted);font-size:13px">${esc(t.from)} → ${esc(t.to)} · ${dateBR(resultsDate)} · ${t.depart}</p><p style="color:var(--muted);font-size:13px">Passageiros: <strong>${pax}</strong> · selecione ${pax>1?'até '+pax+' poltronas':'1 poltrona'}.</p><div style="display:flex;justify-content:center;gap:15px;font-size:11px;color:var(--muted)"><span>🟨 Selecionada</span><span>⬜ Disponível</span><span>▪ Indisponível</span></div><div class="seat-grid">${Array.from({length:t.seats||46},(_,i)=>i+1).map(n=>`<button class="seat ${taken.includes(n)?'taken':''}" ${taken.includes(n)?'disabled':''} onclick="selectSeat(${n})" id="seat-${n}">${String(n).padStart(2,'0')}</button>`).join('')}</div><div id="booking-form" style="display:none"><h3>Resumo da passagem</h3><div class="summary-row"><span>Poltrona(s)</span><strong id="chosen-seat">—</strong></div><div class="summary-row"><span>Valor demonstrativo</span><strong id="chosen-total">${fmt(t.price)}</strong></div><button class="primary" style="width:100%;margin-top:16px" onclick="confirmBooking()">Criar pré-reserva fictícia</button><p style="font-size:11px;color:var(--muted);line-height:1.5">Não é necessário informar nome completo ou CPF nesta demonstração.</p></div><div class="notice">Selecione uma poltrona para continuar. Poltronas indisponíveis aparecem esmaecidas.</div></section></div>`}
function selectSeat(n){const pax=searchForm.pax||1;const i=selectedSeats.indexOf(n);if(i>=0)selectedSeats.splice(i,1);else{if(selectedSeats.length>=pax){toast(pax===1?'Desmarque a poltrona atual para escolher outra.':'Você selecionou '+pax+' passageiro(s). Desmarque uma poltrona para trocar.');return}selectedSeats.push(n)}selectedSeats.sort((a,b)=>a-b);document.querySelectorAll('.seat').forEach(b=>b.classList.remove('selected'));selectedSeats.forEach(x=>document.getElementById('seat-'+x).classList.add('selected'));document.getElementById('booking-form').style.display=selectedSeats.length?'block':'none';document.getElementById('chosen-seat').textContent=selectedSeats.map(x=>String(x).padStart(2,'0')).join(', ');document.getElementById('chosen-total').textContent=fmt(selectedTrip.price*selectedSeats.length)}
function closeModal(){document.getElementById('modal-root').innerHTML=''}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function confirmBooking(){if(!selectedSeats.length){toast('Escolha uma poltrona primeiro.');return}const t=selectedTrip;try{const r=await api('POST','/reservations',{tripId:t.id,date:resultsDate,seats:selectedSeats,clientId});myReservations.push(...r.reservations);selectedSeats=[];if(searched){try{searchResults=(await api('GET','/search?from='+encodeURIComponent(searchForm.from)+'&to='+encodeURIComponent(searchForm.to)+'&date='+resultsDate)).trips}catch(e){}}else{try{await loadTrips();searchResults=tripsCache.slice(0,3)}catch(e){}}render();showTicket(r.reservations[0].code);if(r.reservations.length>1)toast(r.reservations.length+' reservas criadas: '+r.reservations.map(x=>x.code).join(', ')+'. Veja todas em "Reservas".')}catch(e){if(e.status===409){toast(e.message);openBooking(t.id)}else handleApiError(e)}}
function showTicket(code){const r=myReservations.find(x=>x.code===code);if(!r)return;const payload=`VIAÇÃO HOFFMANN | DEMO | ${r.code} | Origem: ${r.from} | Destino: ${r.to} | Data: ${dateBR(r.date)} | Saída: ${r.depart||'—'} | Poltrona: ${r.seat}`;const qr='https://api.qrserver.com/v1/create-qr-code/?size=220x220&margin=8&data='+encodeURIComponent(payload);document.getElementById('modal-root').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><section class="modal"><div class="modal-head"><h3>Passagem demonstrativa</h3><button class="close" onclick="closeModal()">×</button></div><article class="ticket"><div class="ticket-banner"><div><strong>VIAÇÃO HOFFMANN</strong><small>COMPROVANTE DE VIAGEM · PROTÓTIPO</small></div><span class="ticket-status">${r.status||'PRÉ-RESERVA DEMO'}</span></div><div class="ticket-body"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><div><small style="color:#66758a">CÓDIGO DA RESERVA</small><div style="font-size:23px;font-weight:900;letter-spacing:1px">${r.code}</div></div><div style="text-align:right"><small style="color:#66758a">DATA DA VIAGEM</small><div style="font-weight:800">${dateBR(r.date)}</div></div></div><div class="ticket-route"><div class="ticket-city"><strong>${esc(r.from)}</strong><small>ORIGEM · ${r.depart||'—'}</small></div><div class="ticket-arrow">➜</div><div class="ticket-city"><strong>${esc(r.to)}</strong><small>DESTINO · ${r.arrive||'—'}${nextDay(r)}</small></div></div><div class="ticket-details"><div class="ticket-detail"><small>Poltrona</small><strong>${r.seat}</strong></div><div class="ticket-detail"><small>Ônibus</small><strong>${esc(r.bus||'Ônibus demonstrativo')}</strong></div><div class="ticket-detail"><small>Box de embarque</small><strong>${esc(r.box||'A confirmar no terminal')}</strong></div><div class="ticket-detail"><small>Valor ilustrativo</small><strong>${fmt(r.price)}</strong></div></div><div class="ticket-qr"><img src="${qr}" alt="QR Code demonstrativo para conferência da reserva ${r.code}"><strong>QR CODE · CONFERÊNCIA DE EMBARQUE</strong><p>Apresente este código para demonstrar a conferência no embarque. Ele contém os dados desta reserva fictícia; não realiza validação online.</p></div></div></article><div class="ticket-actions"><button class="primary" onclick="window.print()">Imprimir / Salvar PDF</button><button class="secondary" onclick="closeModal();setView('reservas')">Voltar às reservas</button></div><div class="notice">Atenção: esta é uma passagem de demonstração, não um bilhete válido. O QR é gerado por um serviço externo e requer internet para carregar. Um check-in real precisa de sistema de validação e banco de dados.</div></section></div>`}
function toast(msg){const root=document.getElementById('toast-root');root.innerHTML=`<div class="toast">${esc(msg)}</div>`;setTimeout(()=>root.innerHTML='',3200)}
boot();
async function loadBrazilMunicipalities(){
 try {
  const response=await fetch('https://servicodados.ibge.gov.br/api/v1/localidades/municipios?orderBy=nome');
  if(!response.ok) throw new Error('IBGE indisponível');
  const data=await response.json();
  brazilMunicipalities=data.map(m=>({name:m.nome,uf:(m.microrregiao&&m.microrregiao.mesorregiao&&m.microrregiao.mesorregiao.UF&&m.microrregiao.mesorregiao.UF.sigla)||''}));
  const known=new Set(brazilMunicipalities.map(m=>normCity(m.name))); ['Bom Progresso','Montenegro','Santana do Livramento'].forEach(name=>{if(!known.has(normCity(name))) brazilMunicipalities.push({name,uf:'RS'});}); brazilMunicipalities.sort((a,b)=>a.name.localeCompare(b.name,'pt-BR'));
  const list=document.getElementById('municipality-list'); if(list) list.innerHTML=cityOptions();
  const subtitle=document.getElementById('results-subtitle'); if(subtitle && !searched) subtitle.textContent=`${brazilMunicipalities.length.toLocaleString('pt-BR')} municípios brasileiros disponíveis · pesquise viagens cadastradas no sistema`;
 } catch(e){
  toast('Não foi possível carregar todos os municípios. Só as cidades principais estão disponíveis.');
 }
}
loadBrazilMunicipalities();
setTimeout(()=>document.getElementById('splash').classList.add('hide'),1600);
</script>
